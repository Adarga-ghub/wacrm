name: wacrm

services:
  app:
    build:
      context: .
      # NEXT_PUBLIC_* vars are inlined at build time — forward them
      # from .env.local as build args. Changing any of them requires
      # a rebuild (docker compose up --build).
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
        NEXT_PUBLIC_APP_LOCALE: ${NEXT_PUBLIC_APP_LOCALE:-en}
    # Runtime (server-only) secrets come from .env.local; they are
    # never baked into the image.
    env_file:
      - .env.local
    # The server always listens on 3000 inside the container. Pinned
    # here because `environment` wins over `env_file`, so a stray PORT
    # in .env.local can't desync the app from the mapping and the
    # healthcheck below.
    environment:
      PORT: 3000
    # Host side only — HOST_PORT=8080 publishes the app on :8080.
    ports:
      - '${HOST_PORT:-3000}:3000'
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000').then((r)=>process.exit(r.ok||r.status<500?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Drives the time-based automation pieces (Wait steps, flow-timeout
  # sweep) that the `app` container never schedules on its own — see
  # docs/automations-and-cron.md. Polls the two cron endpoints over the
  # internal Compose network every 5 minutes; no ports are published and
  # no docker.sock access is needed, so it runs unmodified under
  # EasyPanel's Compose service type.
  cron:
    image: curlimages/curl:8.12.1
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    # Reuses AUTOMATION_CRON_SECRET (and nothing else) from the same
    # runtime env file as `app`, so the two never drift out of sync.
    env_file:
      - .env.local
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        if [ -z "$$AUTOMATION_CRON_SECRET" ]; then
          echo "[cron] AUTOMATION_CRON_SECRET is not set — see docs/automations-and-cron.md. Sleeping instead of polling." >&2
          sleep infinity
        fi
        echo "[cron] starting, polling every 5 minutes"
        while true; do
          ts=$$(date -u +%Y-%m-%dT%H:%M:%SZ)
          for path in /api/automations/cron /api/flows/cron; do
            code=$$(curl -sS -o /dev/null -w '%{http_code}' \
              -H "x-cron-secret: $$AUTOMATION_CRON_SECRET" \
              "http://app:3000$$path")
            echo "[cron] $$ts $$path -> $$code"
          done
          sleep 300
        done
